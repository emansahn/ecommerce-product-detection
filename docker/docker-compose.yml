version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: product-detector:latest
    container_name: product_detector_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DEBUG=False
      - API_WORKERS=1
    volumes:
      # Mount model weights without rebuilding the image
      - ../models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

